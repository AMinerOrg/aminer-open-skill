[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "baseline-finder"
version = "0.5.2"
description = "Standalone PDF or AMiner pub_id audit for potentially missing direct experimental baselines"
readme = "SKILL.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "pypdf>=4.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
baseline-finder = "baseline_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["baseline_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
